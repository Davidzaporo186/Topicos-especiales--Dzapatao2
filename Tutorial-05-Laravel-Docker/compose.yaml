# Pruebas locales: docker compose up --build -d
# Generar APP_KEY y completar .env antes de levantar el servicio.
services:
  laravel:
    build: .
    ports:
      - "8080:80"
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: laravelproject
      DB_USERNAME: laravel_user
      DB_PASSWORD: "${LOCAL_DB_PASSWORD:-clave_local_desarrollo}"
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravelproject
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: "${LOCAL_DB_PASSWORD:-clave_local_desarrollo}"
      MYSQL_ROOT_PASSWORD: "${LOCAL_MYSQL_ROOT_PASSWORD:-otra_clave_local_desarrollo}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  mysql_data:
